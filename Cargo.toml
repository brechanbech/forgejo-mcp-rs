[package]
name = "forgejo-mcp-rs"
description = "Model Context Protocol server for Forgejo, Codeberg and Gitea, in Rust."
version = "0.20.3"
edition = "2024"
# 1.88: required by `time` >= 0.3.47, the first release fixing RUSTSEC-2026-0009.
rust-version = "1.88"
license = "MIT"
repository = "https://codeberg.org/brechanbech/forgejo-mcp-rs"
authors = ["Stefan Ractliffe"]
readme = "README.md"
keywords = ["mcp", "forgejo", "gitea", "codeberg", "ci"]
categories = ["development-tools", "api-bindings"]

# Internal library (the `mcp_core` and `forgejo` modules) plus a thin server binary: the
# substance lives in the library so `cargo test` can reach it, and `mcp_core` stays an
# internal module rather than a published crate.
[lib]
name = "forgejo_mcp_rs"
path = "src/lib.rs"

[[bin]]
name = "forgejo-mcp-rs"
path = "src/bin/forgejo.rs"

[lints.rust]
# This server reaches its host over HTTPS — there is no reason to write `unsafe`, so forbid it
# outright (stronger than `deny`: an inner `allow` can't undo it).
unsafe_code = "forbid"
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
# --- MCP ---
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }

# --- REST over reqwest ---
# rustls (bundled webpki roots) instead of the default native-tls: pure-Rust TLS, no Apple/OpenSSL
# system dependency (portable to FreeBSD). Private-CA instances would need `rustls-tls-native-roots`.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
url = "2"
zeroize = "1"

# --- async runtime ---
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }

# --- (de)serialization & schema ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
# Decoding the base64 file bodies the Forgejo `contents` endpoint returns.
base64 = "0.23"

# --- errors / logging ---
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
debug = "line-tables-only"
